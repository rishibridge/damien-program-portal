<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Program Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0e2841;
      --blue: #154672;
      --accent: #26abe4;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #b91c1c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0e2841 0%, #154672 55%, #1e6091 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 24px 48px rgba(14, 40, 65, 0.35);
      padding: 36px 32px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 26px;
    }
    .login-logo {
      height: 52px;
      width: auto;
      object-fit: contain;
      margin-bottom: 12px;
      background: transparent;
      padding: 0;
    }
    .login-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.02em;
    }
    .login-error {
      display: none;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 18px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      font-size: 0.92rem;
      font-family: inherit;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(38, 171, 228, 0.18);
    }
    .login-btn {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.94rem;
      font-weight: 600;
      font-family: inherit;
      color: #ffffff;
      background: var(--blue);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
      margin-top: 4px;
    }
    .login-btn:hover {
      background: var(--navy);
    }
    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .login-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.76rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <img src="/assets/logo.png" alt="Bridge Health" class="login-logo" onerror="this.style.display='none'" />
      <h1 class="login-title">Program Analytics</h1>
    </div>

    <div id="loginError" class="login-error" role="alert"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="loginUsername">Client ID</label>
        <input
          type="text"
          id="loginUsername"
          class="form-input"
          placeholder="Enter your Client ID"
          autocomplete="username"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input
          type="password"
          id="loginPassword"
          class="form-input"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" id="loginSubmitBtn" class="login-btn">Sign In</button>
    </form>

    <form id="mfaForm" style="display:none;" onsubmit="handleMfaVerify(event)">
      <div style="font-size:0.78rem;font-weight:600;color:#334155;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;">
        Choose Verification Method
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
        <button type="button" id="mfaTabEmail" onclick="selectMfaLoginMethod('email')" style="padding:9px 10px;border-radius:8px;border:2px solid #154672;background:#eff6ff;color:#0e2841;font-size:0.8rem;font-weight:600;cursor:pointer;">
          ✉️ Email Code
        </button>
        <button type="button" id="mfaTabTotp" onclick="selectMfaLoginMethod('totp')" style="padding:9px 10px;border-radius:8px;border:1px solid #cbd5e1;background:#ffffff;color:#475569;font-size:0.8rem;font-weight:600;cursor:pointer;">
          📱 Authenticator App
        </button>
      </div>

      <div id="mfaInfoBanner" data-email-code-preview="" style="background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;padding:10px 12px;border-radius:8px;font-size:0.81rem;margin-bottom:16px;line-height:1.45;">
        Enter the 6-digit verification code sent to your email or generated by your Authenticator App.
      </div>

      <div class="form-group">
        <label class="form-label" for="mfaCodeInput" id="mfaCodeLabel">6-Digit Verification Code</label>
        <input
          type="text"
          id="mfaCodeInput"
          class="form-input"
          placeholder="000000"
          maxlength="6"
          pattern="[0-9]{6}"
          inputmode="numeric"
          autocomplete="one-time-code"
          style="letter-spacing:0.25em;font-weight:700;text-align:center;font-size:1.1rem;"
        />
      </div>

      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
        <input type="checkbox" id="mfaTrustDevice" checked style="width:16px;height:16px;accent-color:#154672;cursor:pointer;" />
        <label for="mfaTrustDevice" style="font-size:0.82rem;color:#334155;cursor:pointer;font-weight:500;">
          Trust this browser for 30 days
        </label>
      </div>

      <button type="submit" id="mfaSubmitBtn" class="login-btn">Verify &amp; Sign In</button>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
        <button type="button" id="mfaResendBtn" onclick="handleResendMfa()" style="background:none;border:none;color:#154672;font-size:0.78rem;font-weight:600;cursor:pointer;text-decoration:underline;">
          Resend Email Code
        </button>
        <button type="button" onclick="resetToStep1()" style="background:none;border:none;color:#64748b;font-size:0.78rem;font-weight:500;cursor:pointer;">
          Back to Sign In
        </button>
      </div>
    </form>
  </div>

  <script>
    let currentMfaChallengeToken = null;
    let currentMaskedEmail = 'your email';
    let currentEmailCodePreview = '';
    let currentTotpQrDataUrl = '';
    let currentTotpSecret = '';
    let selectedMfaMethod = 'email';

    function selectMfaLoginMethod(method) {
      selectedMfaMethod = method === 'totp' ? 'totp' : 'email';
      const tabEmail = document.getElementById('mfaTabEmail');
      const tabTotp = document.getElementById('mfaTabTotp');
      const infoEl = document.getElementById('mfaInfoBanner');
      const resendBtn = document.getElementById('mfaResendBtn');
      const lblEl = document.getElementById('mfaCodeLabel');

      if (selectedMfaMethod === 'totp') {
        tabTotp.style.border = '2px solid #154672';
        tabTotp.style.background = '#eff6ff';
        tabTotp.style.color = '#0e2841';
        tabEmail.style.border = '1px solid #cbd5e1';
        tabEmail.style.background = '#ffffff';
        tabEmail.style.color = '#475569';
        resendBtn.style.visibility = 'hidden';
        lblEl.textContent = '6-Digit Authenticator App Code';
        const qrBlock = currentTotpQrDataUrl
          ? '<div style="display:flex;flex-direction:column;align-items:center;margin:10px 0 6px 0;background:#ffffff;padding:10px;border-radius:8px;border:1px solid #cbd5e1;">' +
              '<img id="mfaTotpQrImg" src="' + currentTotpQrDataUrl + '" alt="Scan QR Code with Authenticator App" style="width:168px;height:168px;display:block;" />' +
              '<div style="margin-top:6px;font-size:0.72rem;color:#475569;text-align:center;">Manual Key: <code id="mfaTotpSecretText" style="background:#f1f5f9;padding:1px 5px;border-radius:4px;font-weight:700;color:#0e2841;">' + currentTotpSecret + '</code></div>' +
            '</div>'
          : '';
        infoEl.innerHTML = '<strong>Scan with Authenticator App</strong><br/>Scan this QR code with Google Authenticator, Microsoft Authenticator, or your phone camera, then enter the 6-digit code below:' + qrBlock;
      } else {
        tabEmail.style.border = '2px solid #154672';
        tabEmail.style.background = '#eff6ff';
        tabEmail.style.color = '#0e2841';
        tabTotp.style.border = '1px solid #cbd5e1';
        tabTotp.style.background = '#ffffff';
        tabTotp.style.color = '#475569';
        resendBtn.style.visibility = 'visible';
        lblEl.textContent = '6-Digit Email Verification Code';
        const previewNote = currentEmailCodePreview
          ? '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed #93c5fd;font-size:0.76rem;color:#1e40af;">Code sent to <strong>' + currentMaskedEmail + '</strong> · Instant Code: <strong id="mfaPreviewCodeText" style="letter-spacing:0.08em;background:#dbeafe;padding:1px 6px;border-radius:4px;">' + currentEmailCodePreview + '</strong></div>'
          : '';
        infoEl.innerHTML = '<strong>Email 2-Step Verification</strong><br/>Enter the 6-digit verification code sent to <strong>' + currentMaskedEmail + '</strong>.' + previewNote;
      }
      document.getElementById('mfaCodeInput').focus();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('loginSubmitBtn');
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok && data.ok) {
          if (data.mfaRequired && data.challengeToken) {
            currentMfaChallengeToken = data.challengeToken;
            currentMaskedEmail = data.maskedEmail || 'your email';
            currentEmailCodePreview = data.emailCodePreview || '';
            currentTotpQrDataUrl = data.totpQrDataUrl || '';
            currentTotpSecret = data.totpSecret || '';
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('mfaForm').style.display = 'block';
            const infoEl = document.getElementById('mfaInfoBanner');
            infoEl.setAttribute('data-email-code-preview', currentEmailCodePreview);
            selectMfaLoginMethod(data.mfaMethod || 'email');
            const codeInput = document.getElementById('mfaCodeInput');
            codeInput.value = '';
            codeInput.focus();
            return;
          }
          window.location.href = '/';
          return;
        }
        errEl.textContent = data.error || 'Invalid Client ID or password. Please try again.';
        errEl.style.display = 'block';
      } catch (err) {
        errEl.textContent = 'Unable to reach server. Please check your connection and try again.';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    async function handleMfaVerify(e) {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('mfaSubmitBtn');
      const code = document.getElementById('mfaCodeInput').value.trim();
      const trustDevice = document.getElementById('mfaTrustDevice').checked;

      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const resp = await fetch('/api/auth/verify-mfa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            challengeToken: currentMfaChallengeToken,
            code,
            trustDevice
          })
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok && data.ok) {
          window.location.href = '/';
          return;
        }
        errEl.textContent = data.error || 'Invalid verification code. Please try again.';
        errEl.style.display = 'block';
      } catch (err) {
        errEl.textContent = 'Unable to verify code. Please try again.';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Verify & Sign In';
      }
    }

    async function handleResendMfa() {
      if (!currentMfaChallengeToken) return;
      const infoEl = document.getElementById('mfaInfoBanner');
      try {
        const resp = await fetch('/api/auth/resend-mfa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ challengeToken: currentMfaChallengeToken })
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok && data.ok) {
          infoEl.innerHTML = '<strong>Code Resent!</strong> A fresh 6-digit verification code was sent to <strong>' + (data.maskedEmail || 'your email') + '</strong>.';
        }
      } catch (_) {}
    }

    function resetToStep1() {
      currentMfaChallengeToken = null;
      document.getElementById('mfaForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('loginError').style.display = 'none';
    }
  </script>
</body>
</html>
